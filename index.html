<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parisia - Ville lumière</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Preloader -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-ring"></div>
            <h1>Preparing Flight</h1>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <p id="progress-text">0% loaded</p>
        </div>
    </div>

    <!-- Scroll Container -->
    <div id="scroll-container">
        <!-- Canvas wrapper that stays fixed/sticky -->
        <div class="canvas-wrapper">
            <canvas id="scrub-canvas"></canvas>
            
            <!-- Clean canvas setup with no background text overlays -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
